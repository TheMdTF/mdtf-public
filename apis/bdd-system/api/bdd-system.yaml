openapi: 3.0.3
info:
  title: The Maryland Test Facility Biometric Deepfake Detection System Interface
  description: This document describes an application programming interface for a Biometric Deepfake Detection (BDD) system.  BDD systems determine if a biometric sample contains AI-generated or manipulated biometric characteristics.  This supports both image and video biometric sample inputs.
  version: 1.0.0
  contact:
    name: The MdTF
    url: https://mdtf.org
    email: rivr@mdtf.org
  license:
    name: IDSL API License
    url: https://raw.githubusercontent.com/TheMdTF/mdtf-public/master/LICENSE.md
tags:
  - name: Data Analysis
  - name: Algorithm Information
paths:
  /v1/analyze-data-for-bdd:
    post:
      summary: Analyze biometric capture data for a biometric deepfake.
      description: |
        BDD systems receive data through this endpoint.  This endpoint accepts individual, base64-encoded PNG or JPEG image bytes or a short (~10s) video, encoded as a MOV or MP4.  
      tags:
        - Data Analysis
      operationId: AnalyzeData
      requestBody:
        $ref: '#/components/requestBodies/biometric_sample'
      responses:
        200:
          $ref: '#/components/responses/bdd_analysis_response'
        400:
          $ref: '#/components/responses/400'
        500:
          $ref: '#/components/responses/500'
  /v1/info:
    get:
      summary: Returns basic information for the algorithm.
      description: |
        This endpoint returns some basic information about the BDD algorithm, including provider-specific details such as name, version, modality, thresholds, contact information, recommended detection thresholds, CPUs, and memory.
      tags:
        - Algorithm Information
      operationId: GetInfo
      responses:
        200:
          $ref: '#/components/responses/info_response'
        500:
          $ref: '#/components/responses/500'
components:
  schemas:
    BiometricSample:
      type: string
      format: byte
      description: The biometric sample, encoded as a base64 string.  This can be an individual image, encoded as a PNG or JPEG, or a short (~10s) video, encoded as a MOV or MP4.
      example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAAEElEQVR4nGJiYGAABAAA//8ADAADcZGLFwAAAABJRU5ErkJggg==
      x-nullable: false
    BiometricSampleRequest:
      type: object
      properties:
        BiometricSample:
          $ref: '#/components/schemas/BiometricSample'
    BDDAnalysis:
      description: Data transfer object for biometric deepfake detection results.
      type: object
      required:
        - BDDOutcome
        - BDDScore
      properties:
        BDDOutcome:
          description: Whether a biometric deepfake was determined to be detected (True) or not detected (False).
          type: boolean
          example: true
        BDDScore:
          description: A score corresponding to the level of confidence that a biometric deepfake was detected, ranging between 0 and 1.
          type: number
          format: double
          example: 0.85
        BDDProperties:
          description: Key value pairs describing biometric deepfake properties and their relationship to the deepfake detection outcome/score.  Common properties include ExcessiveSmoothing, AudioVideoMismatch, EyeGazeAnomaly, FacialAsymmetry, SkinTextureAnomaly, BlinkingPatternAnomaly, LipSyncMismatch, and BackgroundInconsistency.  The inclusion of descriptive properties is encouraged to provide more context. Do not include image bytes in the properties. (optional)
          type: array
          items:
            $ref: '#/components/schemas/BDDProperty'
          example:
            - Property: ExcessiveSmoothing
              Value: "true"
            - Property: AudioVideoMismatch
              Value: "false"
            - Property: EyeGazeAnomaly
              Value: "true"
            - Property: FacialAsymmetry
              Value: "false"
            - Property: SkinTextureAnomaly
              Value: "true"
            - Property: BlinkingPatternAnomaly
              Value: "false"
            - Property: LipSyncMismatch
              Value: "false"
            - Property: BackgroundInconsistency
              Value: "false"
    BDDProperty:
      description: Key value pair object describing a detected biometric deepfake property.
      type: object
      properties:
        Property:
          description: >
            Name of the deepfake property.  Common properties include:
            ExcessiveSmoothing, AudioVideoMismatch, EyeGazeAnomaly, FacialAsymmetry,
            SkinTextureAnomaly, BlinkingPatternAnomaly, LipSyncMismatch, BackgroundInconsistency.
          type: string
          example: ExcessiveSmoothing
        Value:
          description: Value for the property.
          type: string
          example: "true"
    Info:
      type: object
      description: Basic information describing the BDD algorithm.
      required:
        - AlgorithmName
        - AlgorithmVersion
        - AlgorithmModality
        - CompanyName
        - TechnicalContactEmail
        - RecommendedCPUs
        - RecommendedMem
        - Event
        - RecommendedDetectionThresholds
      properties:
        AlgorithmName:
          type: string
          description: Name of algorithm.
          example: DeepfakeDetector
        AlgorithmVersion:
          type: string
          description: Algorithm version identifier.
          example: 1.0.0
        AlgorithmModality:
          type: string
          enum:
            - Face
          description: A string enum describing the type of biometric modality the algorithm is meant to process.
        CompanyName:
          type: string
          description: Name of the company which produced the algorithm.
          example: MdTF
        TechnicalContactEmail:
          type: string
          description: |
            The email address of an engineer or other technical resource to contact in the event of an error running your service.
          example: john@mdtf.org
        RecommendedCPUs:
          type: number
          format: float
          description: The recommended allocation of CPUs for the deployed docker container.
          example: 1.0
          maximum: 8
        RecommendedMem:
          type: integer
          description: The recommended allocation of memory (MB) for the deployed docker container.
          example: 1024
          maximum: 8192
        Event:
          description: The name of the test event.
          type: string
          enum:
            - RIVR_BDD
        RecommendedDetectionThresholds:
          description: |
            A map of specific False Reject Rates (FRRs) to vendor-provided recommended detection threshold values.  BDDScore values returned from calls to
            /v1/analyze-data-for-bdd indicate a biometric deepfake is detected if they are greater than the provided threshold value at the respective BPCER.
            Note 1: Threshold values are floats stored as strings and cannot exceed a length of 10 characters.
            Note 2: There are 4 required thresholds.
          maxProperties: 4
          type: object
          properties:
            1:ten:
              type: string
              maxLength: 10
            1:1e2:
              type: string
              maxLength: 10
            1:1e3:
              type: string
              maxLength: 10
            1:1e4:
              type: string
              maxLength: 10
          required:
            - "1:ten"
            - "1:1e2"
            - "1:1e3"
            - "1:1e4"
          example:
            1:ten: '0.70'
            1:1e2: '0.82'
            1:1e3: '0.91'
            1:1e4: '0.96'
    Error:
      type: object
      properties:
        Code:
          type: integer
          description: The error code.
        Message:
          type: string
          description: A description of the returned code.
        ErrorString:
          type: string
          description: A detailed description of the error that occurred.
  requestBodies:
    biometric_sample:
      description: A biometric sample to be analyzed for evidence of a biometric deepfake.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BiometricSampleRequest'
  responses:
    bdd_analysis_response:
      description: The result of an analysis of a biometric sample for a biometric deepfake.  Failure to respond with BDD analysis should set an appropriate status code indicating a failure and return an explanatory error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BDDAnalysis'
    info_response:
      description: info response object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Info'
    400:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    500:
      description: This request failed because of a server side issue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
